# blast-demo — minimal-permission Agent preset for the BLAST engineering workspace.
#
# This file is an AGENT-PLANE composition: it decides what the model can see and
# do. It is generated by blast_engineering_ui/tools/install-demo-profile.mjs from
# this template ({{REPO_ROOT}} is substituted with the absolute repository path),
# because a preset row resolves a bare package name from the profile/installation
# package resolver while a relative path resolves from the preset's own directory —
# and the preset lives in <DSH_HOME>/.agent-presets/blast-demo, outside the
# repository. The tool plugin itself is therefore named as the bare subpath
# `blast-engineering-ui/blast-tools` (declared in that package's `exports`).
#
# What this preset deliberately does NOT mount, and why (see docs/DEMO_PROFILE.md):
#   * no `@deepseek-ai/dsh-tool-pwsh`  — there is no general PowerShell surface;
#   * no `@deepseek-ai/dsh-tool-fs`    — the workspace data reaches the model
#     through `blast_engine`'s own operations instead;
#   * no `@deepseek-ai/dsh-tool-web`, no subagents, no workflows.
# The only execution surfaces are the two tools this repository ships:
# `blast_engine` (fixed argv over the project adapter CLI, no shell) and
# `blast_shell` (allowlist first, user approval for anything else).

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the BLAST shaft-blast design agent, working inside a voice-first,
      case-centric engineering workspace. Your working directory is {{cwd}}.

      Engineering work goes through the `blast_engine` tool: it runs this project's
      own adapter CLI (validate → run → status → result) with a fixed, validated
      argv and no shell. Use `blast_shell` only when something outside its
      allowlist is genuinely required; it will ask the user first.

      Rules you do not bend: every number you report must come from a tool result
      of this session — never estimate, interpolate or invent hole counts,
      spacings, charge masses or confidence; a parameter change creates a NEW
      design version (pass the current task id as `parent_task_id`); the design
      status is whatever the project's own canonical result says, including when
      it says the design needs human review.

      The user is looking at a workspace, not a terminal: answer in short
      engineering sentences, name the artifacts (平面布孔图 / 3D炮孔布置 / 装药结构 /
      工程QC / 设计报告) rather than file paths, and keep raw JSON, logs and
      development detail out of the reply.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# The repository's own tool plugin: the Demo Profile's only execution surface.
# One BARE package subpath — NOT an absolute path. A preset row's bare specifier is
# resolved by the harness package resolver (profile → installation) and the module
# it resolves joins that resolver's own chain, which is what lets this file's own
# `@deepseek-ai/dsh-tools` import resolve as well. An absolute path is imported as
# a plain file: URL instead, and then everything IT imports has to be found by
# Node's own lookup from the repository — which has no node_modules of its own, so
# the row fails with `Cannot find package '@deepseek-ai/dsh-tools'` and no session
# can be created for this preset.
- id: blast-demo-tools
  name: 'blast-engineering-ui/blast-tools'

# Skills stay on the agent plane: the registry lives in the host composition, and
# these two rows give this preset local skill discovery (repository <cwd>/.dsh/skills)
# plus the catalog/loader tool.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
